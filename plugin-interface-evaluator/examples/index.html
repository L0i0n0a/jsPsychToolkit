<!DOCTYPE html>
<html>
  <head>
    <title>plugin-interface-evaluator – Beispiel</title>

    <!-- jsPsych (React ist im Plugin-Bundle enthalten) -->
    <script src="/node_modules/jspsych/dist/index.browser.min.js"></script>
    <link rel="stylesheet" href="/node_modules/jspsych/css/jspsych.css" />

    <!-- Unser Plugin (lokal gebaut) -->
    <script src="../dist/index.browser.min.js"></script>
  </head>

  <body></body>

  <script>
    const jsPsych = initJsPsych({
      on_finish: () => {
        console.log("Experiment-Daten:", jsPsych.data.get().values());
      }
    });

    // Minimales Inline-Plugin das die Daten des vorigen Trials anzeigt.
    // Nur für Testzwecke — nicht für echte Studien gedacht.
    class ResultsDisplay {
      static info = { name: "results-display", parameters: {}, version: "1.0.0" };
      constructor(jsPsych) { this.jsPsych = jsPsych; }
      trial(display_element) {
        const data = this.jsPsych.data.getLastTrialData().values()[0];

        // Screenshot separat rausziehen damit er als <img> gerendert wird
        const { screenshot, components, ...rest } = data;

        // Platzierte Komponenten als Tabelle
        const componentsTable = components?.length
          ? `<table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:16px;">
              <thead><tr style="background:#e5e7eb;">
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">instanceId</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">registryId</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">x</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">y</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">annotation</th>
              </tr></thead>
              <tbody>${components.map(c => `
                <tr>
                  <td style="padding:6px; border:1px solid #ddd;">${c.instanceId}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.registryId}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.x?.toFixed(0)}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.y?.toFixed(0)}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.annotation ?? "–"}</td>
                </tr>`).join("")}
              </tbody>
            </table>`
          : "";

        display_element.innerHTML = `
          <div style="padding:24px; font-family:sans-serif; max-height:90vh; overflow:auto; background:#f8f8f8;">
            <h2 style="margin-bottom:16px;">Trial-Ergebnisse</h2>

            ${components ? `<h3 style="margin-bottom:8px;">Platzierte Komponenten</h3>${componentsTable}` : ""}

            ${screenshot ? `
              <h3 style="margin-bottom:8px;">Screenshot</h3>
              <img src="${screenshot}" style="max-width:100%; border:1px solid #ddd; border-radius:8px; margin-bottom:16px;" />
            ` : ""}

            <h3 style="margin-bottom:8px;">Restliche Daten</h3>
            <pre style="background:white; padding:16px; border-radius:8px; border:1px solid #ddd; overflow:auto; font-size:12px;">${JSON.stringify(rest, null, 2)}</pre>

            <button id="weiter" style="margin-top:16px; padding:8px 20px; background:#4f46e5; color:white; border:none; border-radius:6px; cursor:pointer; font-size:14px;">Weiter →</button>
          </div>
        `;
        display_element.querySelector("#weiter").onclick = () => this.jsPsych.finishTrial();
      }
    }
    const resultsTrial = { type: ResultsDisplay };

    // Modus 1: Annotation (ohne Heuristiken)
    // Forschende übergeben ein fertiges Interface als HTML-String.
    // Teilnehmende können Elemente anklicken und mit Text annotieren.
    const annotationTrial = {
      type: jsPsychInterfaceEvaluator,
      outputType: "Annotation",
      interface: `
        <div style="display:flex; flex-direction:column; padding: 24px; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
          <h2>Beispiel-Interface</h2>
          <p>Klicke auf Elemente um sie zu annotieren.</p>
          <button style="padding: 8px 16px; margin: 8px; background: #4f46e5; color: white; border: none; border-radius: 4px;">
            Primärer Button
          </button>
          <input type="text" placeholder="Eingabefeld" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
      `,
    };

    // Modus 1b: Annotation mit Nielsen-Heuristiken
    // Die Heuristiken-Sidebar erscheint rechts neben dem Interface.
    // Teilnehmende wählen zuerst eine aktive Heuristik, dann annotieren sie Elemente.
    const annotationWithHeuristicsTrial = {
      type: jsPsychInterfaceEvaluator,
      outputType: "Annotation",
      interface: `
        <div style="display:flex; flex-direction:column; padding: 24px; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
          <h2>Beispiel-Interface</h2>
          <p>Wähle zuerst eine Heuristik in der Sidebar, dann klicke auf Elemente.</p>
          <button style="padding: 8px 16px; margin: 8px; background: #4f46e5; color: white; border: none; border-radius: 4px;">
            Primärer Button
          </button>
          <input type="text" placeholder="Eingabefeld" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
      `,
      heuristic: [
        { id: "n1", title: "1 – Sichtbarkeit des Systemstatus", description: "Das System soll Nutzer stets über den aktuellen Zustand informieren – durch angemessenes Feedback in vernünftiger Zeit." },
        { id: "n2", title: "2 – Übereinstimmung mit der realen Welt", description: "Das System soll die Sprache des Nutzers sprechen: Wörter, Phrasen und Konzepte die dem Nutzer vertraut sind, statt systemorientierten Begriffen." },
        { id: "n3", title: "3 – Nutzerkontrolle und Freiheit", description: "Nutzer wählen Systemfunktionen manchmal versehentlich aus und benötigen einen klar gekennzeichneten Notausgang, um den ungewollten Zustand zu verlassen." },
        { id: "n4", title: "4 – Konsistenz und Standards", description: "Nutzer sollten sich nicht fragen müssen, ob verschiedene Wörter, Situationen oder Aktionen dasselbe bedeuten. Plattformkonventionen sollten eingehalten werden." },
        { id: "n5", title: "5 – Fehlervermeidung", description: "Noch besser als gute Fehlermeldungen ist ein sorgfältiges Design, das Probleme von vornherein verhindert." },
        { id: "n6", title: "6 – Wiedererkennung statt Erinnerung", description: "Objekte, Aktionen und Optionen sollen sichtbar sein. Der Nutzer soll sich nicht Informationen von einem Teil des Dialogs zum nächsten merken müssen." },
        { id: "n7", title: "7 – Flexibilität und Effizienz", description: "Beschleuniger – für den ungeübten Nutzer unsichtbar – erlauben es erfahrenen Nutzern, Interaktionen zu beschleunigen." },
        { id: "n8", title: "8 – Ästhetisches und minimalistisches Design", description: "Dialoge sollten keine irrelevanten oder selten benötigten Informationen enthalten. Jede zusätzliche Informationseinheit konkurriert mit relevanten Informationen." },
        { id: "n9", title: "9 – Hilfe bei der Erkennung, Diagnose und Behebung von Fehlern", description: "Fehlermeldungen sollen in klarer Sprache (kein Code) ausgedrückt werden, das Problem präzise beschreiben und konstruktiv eine Lösung vorschlagen." },
        { id: "n10", title: "10 – Hilfe und Dokumentation", description: "Auch wenn es besser ist, wenn das System ohne Dokumentation auskommt, kann es notwendig sein, Hilfe bereitzustellen." },
      ],
    };

    // Modus 2: Interface Building
    // Teilnehmende bauen selbst ein Interface aus der Sidebar.
    // Ergebnis: Liste platzierter Komponenten + Interaktions-Events.
    const builderTrial = {
      type: jsPsychInterfaceEvaluator,
      outputType: "Interface Building",
      // Optional: nur bestimmte Komponenten zeigen (IDs aus der Library, oder eigene Objekte)
      // components: ["button-primary", "input-text"],
      screenshot: true,
    };

    jsPsych.run([
      annotationTrial, resultsTrial,
      annotationWithHeuristicsTrial, resultsTrial,
      builderTrial, resultsTrial,
    ]);
  </script>
</html>
