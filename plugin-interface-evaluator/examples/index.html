<!DOCTYPE html>
<html>
  <head>
    <title>plugin-interface-evaluator – Example</title>

    <!-- jsPsych (React is included in the plugin bundle) -->
    <script src="../node_modules/jspsych/dist/index.browser.min.js"></script>
    <link rel="stylesheet" href="../node_modules/jspsych/css/jspsych.css" />

    <!-- This plugin (locally built) -->
    <script src="../dist/index.browser.min.js"></script>
  </head>

  <body></body>

  <script>
    const jsPsych = initJsPsych({
      on_finish: () => {
        console.log("Experiment data:", jsPsych.data.get().values());
      }
    });

    // Minimal inline plugin that displays the data from the previous trial.
    // For testing only — not intended for real studies.
    class ResultsDisplay {
      static info = { name: "results-display", parameters: {}, version: "1.0.0" };
      constructor(jsPsych) { this.jsPsych = jsPsych; }
      trial(display_element) {
        const data = this.jsPsych.data.getLastTrialData().values()[0];

        // Extract screenshot separately so it can be rendered as an <img>
        const { screenshot, components, ...rest } = data;

        // Placed components as a table
        const componentsTable = components?.length
          ? `<table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:16px;">
              <thead><tr style="background:#e5e7eb;">
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">instanceId</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">registryId</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">x</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">y</th>
                <th style="padding:6px; text-align:left; border:1px solid #ddd;">annotation</th>
              </tr></thead>
              <tbody>${components.map(c => `
                <tr>
                  <td style="padding:6px; border:1px solid #ddd;">${c.instanceId}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.registryId}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.x?.toFixed(0)}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.y?.toFixed(0)}</td>
                  <td style="padding:6px; border:1px solid #ddd;">${c.annotation ?? "–"}</td>
                </tr>`).join("")}
              </tbody>
            </table>`
          : "";

        display_element.innerHTML = `
          <div style="padding:24px; font-family:sans-serif; max-height:90vh; overflow:auto; background:#f8f8f8;">
            <h2 style="margin-bottom:16px;">Trial Results</h2>

            ${components ? `<h3 style="margin-bottom:8px;">Placed Components</h3>${componentsTable}` : ""}

            ${screenshot ? `
              <h3 style="margin-bottom:8px;">Screenshot</h3>
              <img src="${screenshot}" style="max-width:100%; border:1px solid #ddd; border-radius:8px; margin-bottom:16px;" />
            ` : ""}

            <h3 style="margin-bottom:8px;">Remaining Data</h3>
            <pre style="background:white; padding:16px; border-radius:8px; border:1px solid #ddd; overflow:auto; font-size:12px;">${JSON.stringify(rest, null, 2)}</pre>

            <button id="next" style="margin-top:16px; padding:8px 20px; background:#4f46e5; color:white; border:none; border-radius:6px; cursor:pointer; font-size:14px;">Next →</button>
          </div>
        `;
        display_element.querySelector("#next").onclick = () => this.jsPsych.finishTrial();
      }
    }
    const resultsTrial = { type: ResultsDisplay };

    // Mode 1: Annotation (without heuristics)
    // Researchers provide a finished interface as an HTML string.
    // Participants can click on elements and annotate them with text.
    const annotationTrial = {
      type: jsPsychInterfaceEvaluator,
      outputType: "Annotation",
      interface: `
        <div style="display:flex; flex-direction:column; padding: 24px; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
          <h2>Example Interface</h2>
          <p>Click on elements to annotate them.</p>
          <button style="padding: 8px 16px; margin: 8px; background: #4f46e5; color: white; border: none; border-radius: 4px;">
            Primary Button
          </button>
          <input type="text" placeholder="Text input" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
      `,
    };

    // Mode 1b: Annotation with Nielsen heuristics
    // A heuristics sidebar appears to the right of the interface.
    // Participants first select an active heuristic, then annotate elements.
    const annotationWithHeuristicsTrial = {
      type: jsPsychInterfaceEvaluator,
      outputType: "Annotation",
      interface: `
        <div style="display:flex; flex-direction:column; padding: 24px; font-family: sans-serif; border: 1px solid #ccc; border-radius: 8px;">
          <h2>Example Interface</h2>
          <p>First select a heuristic in the sidebar, then click on elements to annotate them.</p>
          <button style="padding: 8px 16px; margin: 8px; background: #4f46e5; color: white; border: none; border-radius: 4px;">
            Primary Button
          </button>
          <input type="text" placeholder="Text input" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" />
        </div>
      `,
      heuristic: [
        { id: "n1", title: "1 – Visibility of System Status", description: "The system should always keep users informed about what is going on, through appropriate feedback within reasonable time." },
        { id: "n2", title: "2 – Match Between System and the Real World", description: "The system should speak the user's language, using words, phrases and concepts familiar to the user, rather than system-oriented terms." },
        { id: "n3", title: "3 – User Control and Freedom", description: "Users often choose system functions by mistake and will need a clearly marked emergency exit to leave the unwanted state without having to go through an extended dialogue." },
        { id: "n4", title: "4 – Consistency and Standards", description: "Users should not have to wonder whether different words, situations, or actions mean the same thing. Follow platform conventions." },
        { id: "n5", title: "5 – Error Prevention", description: "Even better than good error messages is a careful design which prevents a problem from occurring in the first place." },
        { id: "n6", title: "6 – Recognition Rather Than Recall", description: "Minimize the user's memory load by making objects, actions, and options visible. The user should not have to remember information from one part of the dialogue to another." },
        { id: "n7", title: "7 – Flexibility and Efficiency of Use", description: "Accelerators — unseen by the novice user — may often speed up the interaction for the expert user such that the system can cater to both inexperienced and experienced users." },
        { id: "n8", title: "8 – Aesthetic and Minimalist Design", description: "Dialogues should not contain irrelevant or rarely needed information. Every extra unit of information competes with the relevant information and diminishes its relative visibility." },
        { id: "n9", title: "9 – Help Users Recognize, Diagnose, and Recover from Errors", description: "Error messages should be expressed in plain language (no codes), precisely indicate the problem, and constructively suggest a solution." },
        { id: "n10", title: "10 – Help and Documentation", description: "Even though it is better if the system can be used without documentation, it may be necessary to provide help and documentation." },
      ],
    };

    // Mode 1c: Annotation, multi-screen + severity scale + custom labels
    // Screens below are trimmed placeholders so this example stays self-contained and runnable as-is.
    // `interface_labels` gives the tabs a name; without it they'd just be "1", "2", "3".
    const multiScreenTrial = {
      type: jsPsychInterfaceEvaluator,
      outputType: "Annotation",
      interface: [
        `<div style="padding:24px; font-family:sans-serif;">
           <h2>Step 1 — Welcome</h2>
           <p>Choose a study design to get started.</p>
           <button style="padding:8px 16px; background:#4f46e5; color:white; border:none; border-radius:4px;">Continue</button>
         </div>`,
        `<div style="padding:24px; font-family:sans-serif;">
           <h2>Step 2 — Study Design</h2>
           <select style="padding:8px; border:1px solid #ccc; border-radius:4px;">
             <option>Between-subjects</option>
             <option>Within-subjects</option>
           </select>
         </div>`,
        `<div style="padding:24px; font-family:sans-serif;">
           <h2>Step 3 — Plugin Selection</h2>
           <input type="checkbox" id="p1" /> <label for="p1">html-button-response</label><br/>
           <input type="checkbox" id="p2" /> <label for="p2">survey-likert</label>
         </div>`,
      ],
      interface_labels: ["Welcome", "Study Design", "Plugin Selection"],
      // Same 10 Nielsen heuristics as the trial above — reused, not redefined.
      heuristic: annotationWithHeuristicsTrial.heuristic,
      // Element ids get an "s1:", "s2:", "s3:" prefix (one per screen above) so
      // annotations never collide between screens, even with identical markup.
      severity_scale: {
        title: "Severity (Nielsen 0–4)",
        options: [
          { value: 0, label: "0 – Not a usability problem" },
          { value: 1, label: "1 – Cosmetic problem" },
          { value: 2, label: "2 – Minor usability problem" },
          { value: 3, label: "3 – Major usability problem" },
          { value: 4, label: "4 – Usability catastrophe" },
        ],
      },
      // Overrides the plugin's own UI texts (defaults are German — see
      // src/lib/labels.ts); any subset can be given, missing keys keep the default.
      labels: {
        annotationTitle: "Annotation",
        annotationPlaceholder: "What do you notice about this element?",
        annotationHeuristic: "Heuristic",
        annotationHeuristicPlaceholder: "Please select...",
        cancel: "Cancel",
        save: "Save",
        heuristicsTitle: "Heuristics",
        heuristicNotePlaceholder: "General note on this heuristic...",
        heuristicDone: "Done",
        finish: "Finish",
      },
    };

    // Mode 2: Interface Building
    // Participants build their own interface by dragging components from the sidebar onto the canvas.
    // Result: list of placed components + interaction events.
    const builderTrial = {
      type: jsPsychInterfaceEvaluator,
      outputType: "Interface Building",
      // Optional: show only specific components (IDs from the library, or custom objects)
      // components: ["button-primary", "input-text"],
      screenshot: true,
    };

    jsPsych.run([
      annotationTrial, resultsTrial,
      annotationWithHeuristicsTrial, resultsTrial,
      multiScreenTrial, resultsTrial,
      builderTrial, resultsTrial,
    ]);
  </script>
</html>
